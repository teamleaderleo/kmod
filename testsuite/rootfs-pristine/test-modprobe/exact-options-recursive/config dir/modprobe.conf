alias recursive-marker mod-loop-a
install mod-loop-b /bin/sh -c 'printf "%s %s\\n" "${#KMOD_MODPROBE_OPTIONS_EXACT}" "${#MODPROBE_OPTIONS}" >> /exact-options-lengths.txt; exec "$MODPROBE" mod-loop-c'
install mod-loop-c /bin/sh -c 'printf "%s %s\\n" "${#KMOD_MODPROBE_OPTIONS_EXACT}" "${#MODPROBE_OPTIONS}" >> /exact-options-lengths.txt; exec "$MODPROBE" mod-loop-d'
install mod-loop-d /bin/sh -c 'printf "%s %s\\n" "${#KMOD_MODPROBE_OPTIONS_EXACT}" "${#MODPROBE_OPTIONS}" >> /exact-options-lengths.txt; exec "$MODPROBE" --show-alias recursive-marker'
