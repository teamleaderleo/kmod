name: Materialize validated modprobe empty-options repair

on:
  push:
    branches:
      - fix/modprobe-empty-options-source-current
  pull_request:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: materialize-modprobe-empty-options-source
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out clean source branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/modprobe-empty-options-source-current
          fetch-depth: 0

      - name: Verify exact current-master ancestry and carrier
        shell: bash
        run: |
          set -euo pipefail
          base=dae6c02ffed2e8d16da8dba16d974fc955eebb1f
          carrier=9dbb2701a2fcf96280a99b8d2ebcb4b0451be6b3
          test "$(git merge-base HEAD "$base")" = "$base"
          test "$(git rev-parse "$base:tools/modprobe.c")" = c4b5021137a01529d75d9979e262308ce371bbae
          git fetch origin "$carrier"
          git show "$carrier:.github/modprobe-empty-options-environment.patch" > "$RUNNER_TEMP/candidate.patch"
          printf '%s  %s\n' eb043a8ba8579353723da0c68987cbccf86cb4b492278e4791016602f727a07d "$RUNNER_TEMP/candidate.patch" | sha256sum -c -
          git apply --check "$RUNNER_TEMP/candidate.patch"

      - name: Apply exact validated two-file repair
        shell: bash
        run: |
          set -euo pipefail
          git apply "$RUNNER_TEMP/candidate.patch"
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "testsuite/test-modprobe.c tools/modprobe.c "
          clang-format --dry-run --Werror tools/modprobe.c testsuite/test-modprobe.c

      - name: Re-run direct native smoke test
        shell: bash
        run: |
          set -euo pipefail
          sudo -E ./.github/actions/setup-os/setup-ubuntu.sh
          CC=gcc meson setup --native-file build-dev.ini -Dmbedtls=disabled build-transfer
          meson compile -C build-transfer
          MODPROBE_OPTIONS='' build-transfer/modprobe --version > "$RUNNER_TEMP/modprobe.out" 2> "$RUNNER_TEMP/modprobe.err"
          test ! -s "$RUNNER_TEMP/modprobe.err"
          meson compile -C build-transfer testsuite/create-rootfs
          meson test -C build-transfer test-modprobe --verbose

      - name: Publish source-only branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-transfer
          git rm .github/workflows/materialize-modprobe-empty-options-source.yml
          git add tools/modprobe.c testsuite/test-modprobe.c
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = ".github/workflows/materialize-modprobe-empty-options-source.yml testsuite/test-modprobe.c tools/modprobe.c "
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix: size MODPROBE_OPTIONS allocation correctly'
          git push origin HEAD:fix/modprobe-empty-options-source-current
