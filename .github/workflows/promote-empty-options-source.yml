name: Promote validated empty-options repair

on:
  push:
    branches:
      - fix/modprobe-empty-options-environment-source

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/modprobe-empty-options-environment-source
          fetch-depth: 0

      - name: Materialize validated two-file repair
        shell: bash
        run: |
          set -euo pipefail
          branch=fix/modprobe-empty-options-environment-source
          source=dae6c02ffed2e8d16da8dba16d974fc955eebb1f
          carrier=9dbb2701a2fcf96280a99b8d2ebcb4b0451be6b3
          workflow=.github/workflows/promote-empty-options-source.yml
          patch="$RUNNER_TEMP/modprobe-empty-options-environment.patch"

          test "$(git rev-parse HEAD^)" = "$source"
          test "$(git rev-parse HEAD:tools/modprobe.c)" = c4b5021137a01529d75d9979e262308ce371bbae
          test "$(git rev-parse HEAD:testsuite/test-modprobe.c)" = 6b62644ae56ad76e031e70dfa8fa697110b64e82

          git fetch --no-tags origin "$carrier"
          git show FETCH_HEAD:.github/modprobe-empty-options-environment.patch > "$patch"
          test "$(git hash-object "$patch")" = 08612258b78b1b0529bf2bc999ac88d1df21cb94
          echo 'eb043a8ba8579353723da0c68987cbccf86cb4b492278e4791016602f727a07d  '"$patch" | sha256sum --check

          git apply --check --index "$patch"
          git apply --index "$patch"
          git diff --cached --check
          test "$(git diff --cached --name-only | LC_ALL=C sort | tr '\n' ' ')" = \
            'testsuite/test-modprobe.c tools/modprobe.c '

          rm "$workflow"
          git add -u "$workflow"
          test "$(git diff --cached --name-only | LC_ALL=C sort | tr '\n' ' ')" = \
            '.github/workflows/promote-empty-options-source.yml testsuite/test-modprobe.c tools/modprobe.c '

          git config user.name 'teamleaderleo automation'
          git config user.email 'teamleaderleo@users.noreply.github.com'
          git commit -m 'modprobe: fix empty MODPROBE_OPTIONS allocation'
          test "$(git diff HEAD^ --name-only | LC_ALL=C sort | tr '\n' ' ')" = \
            '.github/workflows/promote-empty-options-source.yml testsuite/test-modprobe.c tools/modprobe.c '
          test ! -e "$workflow"
          git push origin "HEAD:$branch"
