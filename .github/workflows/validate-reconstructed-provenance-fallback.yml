name: Validate reconstructed provenance fallback

on:
  push:
    branches: [experiment/modprobe-exact-option-provenance-fallback-reconstructed]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reconstructed-provenance-fallback-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reconstructed-candidate:
    name: reconstructed fallback (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    env:
      KDIR: any
      ASAN_OPTIONS: abort_on_error=1:detect_leaks=1:strict_string_checks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

    steps:
      - name: Check out clean reconstruction branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: experiment/modprobe-exact-option-provenance-fallback-reconstructed
          fetch-depth: 0
          persist-credentials: false

      - name: Verify and recover clean provenance inputs
        shell: bash
        run: |
          set -euo pipefail
          base=5086df53090b2fe9fa1c31351c05a78a12a4ba71
          test "$(git merge-base HEAD "$base")" = "$base"
          test "$(git rev-parse "$base:tools/modprobe.c")" = 413960cae0f39945a3f2d6509dc4a8c262ae2609
          git diff --quiet "$base" -- . ':(exclude).github'
          git status --short | tee "$RUNNER_TEMP/status-before.txt"
          test ! -s "$RUNNER_TEMP/status-before.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/reconstruction-head.txt"

          git show origin/experiment/modprobe-exact-option-provenance:.github/modprobe-exact-option-provenance.patch.gz.b64 > "$RUNNER_TEMP/strict.b64"
          base64 --decode "$RUNNER_TEMP/strict.b64" > "$RUNNER_TEMP/strict.gz"
          echo 'ae01646901a5bc8305a4869446344022e21be420414ab6074fa1e2a7a5be75bd  '"$RUNNER_TEMP/strict.gz" | sha256sum --check
          gzip -dc "$RUNNER_TEMP/strict.gz" > "$RUNNER_TEMP/strict.patch"
          echo 'caed53a3a7f5dc57f2d4114da21a623dfd9ea1343881bdced3617adf30ecee32  '"$RUNNER_TEMP/strict.patch" | sha256sum --check

          git show origin/experiment/modprobe-exact-option-provenance-fallback:.github/modprobe-exact-option-provenance-fallback.patch.gz.b64 > "$RUNNER_TEMP/fallback.b64"
          echo 'c11bc8225e9e16f29638bbc9c5cf53ccd3c0a21d5be6ae31df2f392e86b59599  '"$RUNNER_TEMP/fallback.b64" | sha256sum --check
          base64 --decode "$RUNNER_TEMP/fallback.b64" > "$RUNNER_TEMP/fallback.gz"
          set +e
          gzip -dc "$RUNNER_TEMP/fallback.gz" > "$RUNNER_TEMP/fallback.damaged.patch" 2> "$RUNNER_TEMP/fallback-gzip.err"
          status=$?
          set -e
          test "$status" -ne 0
          test -s "$RUNNER_TEMP/fallback.damaged.patch"

          git show origin/experiment/modprobe-exact-option-provenance-fallback:.github/test-modprobe-option-provenance-fallback.py > "$RUNNER_TEMP/fallback-discriminator.py"
          echo 'c1edefd417f0fbffdd31dc71d1aca390bf4a0e52e327e15d3447a977e77f5f08  '"$RUNNER_TEMP/fallback-discriminator.py" | sha256sum --check

      - name: Materialize intact fixtures and clean strict tools diff
        shell: bash
        run: |
          set -euo pipefail
          PATCH="$RUNNER_TEMP/fallback.damaged.patch" STRICT="$RUNNER_TEMP/strict.patch" FIXTURES="$RUNNER_TEMP/fixtures.patch" TOOLS="$RUNNER_TEMP/strict-tools.patch" python3 - <<'PY'
          import os
          from pathlib import Path

          def sections(text):
              lines = text.splitlines(keepends=True)
              starts = [i for i, line in enumerate(lines) if line.startswith("diff --git ")]
              starts.append(len(lines))
              return ["".join(lines[starts[i]:starts[i + 1]]) for i in range(len(starts) - 1)]

          fallback = sections(Path(os.environ["PATCH"]).read_text(errors="surrogateescape"))
          strict = sections(Path(os.environ["STRICT"]).read_text(errors="surrogateescape"))
          assert len(fallback) == 29
          assert fallback[28].startswith("diff --git a/tools/modprobe.c b/tools/modprobe.c")
          tools = next(s for s in strict if s.startswith("diff --git a/tools/modprobe.c b/tools/modprobe.c"))
          Path(os.environ["FIXTURES"]).write_text("".join(fallback[:28]), errors="surrogateescape")
          Path(os.environ["TOOLS"]).write_text(tools, errors="surrogateescape")
          PY

          git apply --check --index "$RUNNER_TEMP/fixtures.patch"
          git apply --index "$RUNNER_TEMP/fixtures.patch"
          git apply --check --index "$RUNNER_TEMP/strict-tools.patch"
          git apply --index "$RUNNER_TEMP/strict-tools.patch"
          git diff --cached --check
          git diff --cached --name-only | LC_ALL=C sort > "$RUNNER_TEMP/files-before-policy.txt"
          test "$(wc -l < "$RUNNER_TEMP/files-before-policy.txt")" -eq 29
          echo '6aa489e232b40998dc955ff205e16c4d65b6472b956cc395e2d212b45ab5608a  '"$RUNNER_TEMP/files-before-policy.txt" | sha256sum --check
          printf '%s\n' 'historical PR #5 fence 1439259c... is retained as stale metadata; reconstruction-specific staged fence is 6aa489e2...'

      - name: Apply reconstructed policy delta and compare original oracle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("tools/modprobe.c")
          text = p.read_text()
          old = '''\t\terr = option_transport_render_legacy(base, generated, &expected);\n\t\tif (err < 0 || !streq(expected, legacy)) {\n\t\t\tif (err >= 0)\n\t\t\t\terr = -EINVAL;\n\t\t\tgoto error;\n\t\t}\n'''
          new = '''\t\terr = option_transport_render_legacy(base, generated, &expected);\n\t\tif (err < 0)\n\t\t\tgoto error;\n\t\tif (!streq(expected, legacy)) {\n\t\t\tchar *rebased = strdup(legacy);\n\n\t\t\tif (rebased == NULL) {\n\t\t\t\terr = -ENOMEM;\n\t\t\t\tgoto error;\n\t\t\t}\n\t\t\tfree(base);\n\t\t\tbase = rebased;\n\t\t\toption_transport_clear(generated);\n\t\t}\n'''
          assert text.count(old) == 1
          p.write_text(text.replace(old, new))
          PY
          clang-format -i tools/modprobe.c
          git add tools/modprobe.c
          git diff --cached --check
          clang-format --dry-run --Werror tools/modprobe.c
          set +e
          clang-format --dry-run --Werror testsuite/test-modprobe.c
          test_format_status=$?
          set -e
          printf '%s\n' "$test_format_status" | tee "$RUNNER_TEMP/inherited-test-format.status"
          test "$test_format_status" -ne 0
          git diff --cached --name-only | LC_ALL=C sort > "$RUNNER_TEMP/files.txt"
          echo '6aa489e232b40998dc955ff205e16c4d65b6472b956cc395e2d212b45ab5608a  '"$RUNNER_TEMP/files.txt" | sha256sum --check
          git diff --cached --binary > "$RUNNER_TEMP/reconstructed.patch"
          sha256sum "$RUNNER_TEMP/reconstructed.patch" > "$RUNNER_TEMP/reconstructed.sha256"
          PATCH="$RUNNER_TEMP/reconstructed.patch" python3 - <<'PY' | tee "$RUNNER_TEMP/oracle.txt"
          import binascii, os
          from pathlib import Path
          data = Path(os.environ["PATCH"]).read_bytes()
          crc = binascii.crc32(data) & 0xffffffff
          print(f"reconstructed_bytes={len(data)}")
          print(f"reconstructed_crc32={crc:08x}")
          print("original_isize=36682")
          print("original_crc32=23be8cfa")
          print(f"byte_exact_oracle_match={int(len(data) == 36682 and crc == 0x23BE8CFA)}")
          PY
          git diff --cached -- tools/modprobe.c | tee "$RUNNER_TEMP/tools.diff"

      - name: Set up build dependencies
        shell: bash
        run: sudo -E ./.github/actions/setup-os/setup-ubuntu.sh

      - name: Build and test reconstructed successor
        shell: bash
        env:
          CC: ${{ matrix.compiler }}
        run: |
          set -euo pipefail
          extra=()
          if [[ "${{ matrix.compiler }}" == clang ]]; then extra+=("-Db_lundef=false"); fi
          meson setup --native-file build-dev.ini -Dmbedtls=disabled "${extra[@]}" build-${{ matrix.compiler }}
          meson compile -C build-${{ matrix.compiler }}
          if [[ "${{ matrix.compiler }}" == clang ]]; then export LD_LIBRARY_PATH="$(clang -print-resource-dir)/lib/linux${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"; fi
          build-${{ matrix.compiler }}/modprobe --version > "$RUNNER_TEMP/version-${{ matrix.compiler }}.txt"
          for pass in first rerun; do
            meson compile -C build-${{ matrix.compiler }} testsuite/create-rootfs
            meson test -C build-${{ matrix.compiler }} test-modprobe --verbose 2>&1 | tee "$RUNNER_TEMP/focused-${{ matrix.compiler }}-$pass.log"
          done
          meson compile -C build-${{ matrix.compiler }} testsuite/create-rootfs
          meson test -C build-${{ matrix.compiler }} --print-errorlogs 2>&1 | tee "$RUNNER_TEMP/full-${{ matrix.compiler }}.log"
          python3 "$RUNNER_TEMP/fallback-discriminator.py" "$PWD/build-${{ matrix.compiler }}/modprobe" > "$RUNNER_TEMP/fallback-${{ matrix.compiler }}.json"
          sha256sum build-${{ matrix.compiler }}/modprobe > "$RUNNER_TEMP/modprobe-${{ matrix.compiler }}.sha256"

      - name: Retain receipts and restore clean branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/reconstructed-${{ matrix.compiler }}"
          mkdir -p "$out"
          cp "$RUNNER_TEMP"/reconstruction-head.txt "$RUNNER_TEMP"/status-before.txt "$RUNNER_TEMP"/fallback-gzip.err "$RUNNER_TEMP"/files-before-policy.txt "$RUNNER_TEMP"/files.txt "$RUNNER_TEMP"/inherited-test-format.status "$RUNNER_TEMP"/reconstructed.patch "$RUNNER_TEMP"/reconstructed.sha256 "$RUNNER_TEMP"/oracle.txt "$RUNNER_TEMP"/tools.diff "$RUNNER_TEMP"/version-${{ matrix.compiler }}.txt "$RUNNER_TEMP"/focused-${{ matrix.compiler }}-first.log "$RUNNER_TEMP"/focused-${{ matrix.compiler }}-rerun.log "$RUNNER_TEMP"/full-${{ matrix.compiler }}.log "$RUNNER_TEMP"/fallback-${{ matrix.compiler }}.json "$RUNNER_TEMP"/modprobe-${{ matrix.compiler }}.sha256 "$out/" 2>/dev/null || true
          git reset --hard HEAD
          git clean -fdx
          git status --short | tee "$RUNNER_TEMP/status-after.txt"
          test ! -s "$RUNNER_TEMP/status-after.txt"

      - name: Upload reconstructed successor receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kmod-reconstructed-fallback-${{ matrix.compiler }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/reconstructed-${{ matrix.compiler }}/
            ${{ runner.temp }}/status-after.txt
          if-no-files-found: warn
          retention-days: 30
