name: Validate exact option provenance fallback v2

on:
  push:
    branches:
      - experiment/modprobe-exact-option-provenance-fallback
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exact-option-provenance-fallback-v2-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  diagnose-carrier:
    name: fallback carrier integrity oracle
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact experiment branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: experiment/modprobe-exact-option-provenance-fallback
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact sources and decode carriers
        shell: bash
        run: |
          set -euo pipefail
          base=5086df53090b2fe9fa1c31351c05a78a12a4ba71
          test "$(git merge-base HEAD "$base")" = "$base"
          test "$(git rev-parse "$base:tools/modprobe.c")" = \
            413960cae0f39945a3f2d6509dc4a8c262ae2609
          git diff --quiet "$base" -- . ':(exclude).github'
          echo 'c11bc8225e9e16f29638bbc9c5cf53ccd3c0a21d5be6ae31df2f392e86b59599  .github/modprobe-exact-option-provenance-fallback.patch.gz.b64' | sha256sum --check

          fallback_gz="$RUNNER_TEMP/fallback.patch.gz"
          fallback_patch="$RUNNER_TEMP/fallback.patch"
          base64 --decode .github/modprobe-exact-option-provenance-fallback.patch.gz.b64 > "$fallback_gz"
          set +e
          gzip --decompress --stdout "$fallback_gz" > "$fallback_patch" 2> "$RUNNER_TEMP/fallback-gzip.err"
          fallback_status=$?
          set -e
          printf '%s\n' "$fallback_status" > "$RUNNER_TEMP/fallback-gzip.status"
          test -s "$fallback_patch"

          strict_b64="$RUNNER_TEMP/strict.patch.gz.b64"
          strict_gz="$RUNNER_TEMP/strict.patch.gz"
          strict_patch="$RUNNER_TEMP/strict.patch"
          git show origin/experiment/modprobe-exact-option-provenance:.github/modprobe-exact-option-provenance.patch.gz.b64 > "$strict_b64"
          base64 --decode "$strict_b64" > "$strict_gz"
          echo 'ae01646901a5bc8305a4869446344022e21be420414ab6074fa1e2a7a5be75bd  '"$strict_gz" | sha256sum --check
          gzip --decompress --stdout "$strict_gz" > "$strict_patch"
          echo 'caed53a3a7f5dc57f2d4114da21a623dfd9ea1343881bdced3617adf30ecee32  '"$strict_patch" | sha256sum --check
          git apply --check "$strict_patch"

          FALLBACK_GZ="$fallback_gz" FALLBACK_PATCH="$fallback_patch" STRICT_PATCH="$strict_patch" python3 - <<'PY'
          import binascii
          import os
          import pathlib
          import struct

          def metrics(label, data):
              print(f"{label}.bytes={len(data)}")
              print(f"{label}.crc32={binascii.crc32(data) & 0xffffffff:08x}")

          gz = pathlib.Path(os.environ["FALLBACK_GZ"]).read_bytes()
          recovered = pathlib.Path(os.environ["FALLBACK_PATCH"]).read_bytes()
          strict = pathlib.Path(os.environ["STRICT_PATCH"]).read_bytes()
          trailer_crc, trailer_size = struct.unpack("<II", gz[-8:])
          print(f"fallback.gzip_bytes={len(gz)}")
          print(f"fallback.trailer_crc32={trailer_crc:08x}")
          print(f"fallback.trailer_isize={trailer_size}")
          metrics("fallback.recovered", recovered)
          metrics("strict.patch", strict)
          print(f"size_delta.recovered_minus_trailer={len(recovered) - trailer_size}")
          print(f"size_delta.trailer_minus_strict={trailer_size - len(strict)}")
          print(f"crc_match.recovered={int((binascii.crc32(recovered) & 0xffffffff) == trailer_crc)}")
          print(f"size_match.recovered={int((len(recovered) & 0xffffffff) == trailer_size)}")
          PY

          sha256sum "$fallback_gz" "$fallback_patch" "$strict_gz" "$strict_patch" > "$RUNNER_TEMP/carrier-metrics.sha256"
          git status --short | tee "$RUNNER_TEMP/status-after.txt"
          test ! -s "$RUNNER_TEMP/status-after.txt"

      - name: Upload diagnostic receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kmod-fallback-carrier-oracle-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/fallback-gzip.err
            ${{ runner.temp }}/fallback-gzip.status
            ${{ runner.temp }}/carrier-metrics.sha256
            ${{ runner.temp }}/status-after.txt
          if-no-files-found: error
          retention-days: 30
