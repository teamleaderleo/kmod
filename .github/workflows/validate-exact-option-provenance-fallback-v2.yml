name: Validate exact option provenance fallback v2

on:
  push:
    branches:
      - experiment/modprobe-exact-option-provenance-fallback
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exact-option-provenance-fallback-v2-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  diagnose-carrier:
    name: fallback single-bit repair search
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact experiment branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: experiment/modprobe-exact-option-provenance-fallback
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source and search exact repair
        shell: bash
        run: |
          set -euo pipefail
          base=5086df53090b2fe9fa1c31351c05a78a12a4ba71
          test "$(git merge-base HEAD "$base")" = "$base"
          test "$(git rev-parse "$base:tools/modprobe.c")" = \
            413960cae0f39945a3f2d6509dc4a8c262ae2609
          git diff --quiet "$base" -- . ':(exclude).github'
          echo 'c11bc8225e9e16f29638bbc9c5cf53ccd3c0a21d5be6ae31df2f392e86b59599  .github/modprobe-exact-option-provenance-fallback.patch.gz.b64' | sha256sum --check

          base64 --decode .github/modprobe-exact-option-provenance-fallback.patch.gz.b64 > "$RUNNER_TEMP/damaged.patch.gz"
          GZIP="$RUNNER_TEMP/damaged.patch.gz" OUT_GZIP="$RUNNER_TEMP/repaired.patch.gz" OUT_PATCH="$RUNNER_TEMP/repaired.patch" python3 - <<'PY'
          import binascii
          import hashlib
          import os
          import pathlib
          import struct
          import zlib

          gz = bytearray(pathlib.Path(os.environ["GZIP"]).read_bytes())
          expected_crc, expected_size = struct.unpack("<II", gz[-8:])
          print(f"gzip_bytes={len(gz)} expected_crc={expected_crc:08x} expected_size={expected_size}")

          found = []
          for offset in range(10, len(gz) - 8):
              original = gz[offset]
              for bit in range(8):
                  gz[offset] = original ^ (1 << bit)
                  try:
                      out = zlib.decompress(bytes(gz), wbits=31)
                  except zlib.error:
                      continue
                  if len(out) != expected_size:
                      continue
                  if (binascii.crc32(out) & 0xffffffff) != expected_crc:
                      continue
                  found.append((offset, bit, bytes(gz), out))
              gz[offset] = original

          print(f"matching_single_bit_repairs={len(found)}")
          for offset, bit, repaired, out in found:
              print(f"repair offset={offset} bit={bit} xor=0x{1 << bit:02x}")
              print(f"repaired_gzip_sha256={hashlib.sha256(repaired).hexdigest()}")
              print(f"repaired_patch_sha256={hashlib.sha256(out).hexdigest()}")
          if len(found) != 1:
              raise SystemExit(2)

          _, _, repaired, out = found[0]
          pathlib.Path(os.environ["OUT_GZIP"]).write_bytes(repaired)
          pathlib.Path(os.environ["OUT_PATCH"]).write_bytes(out)
          PY

          git apply --check "$RUNNER_TEMP/repaired.patch"
          test "$(grep -c '^diff --git ' "$RUNNER_TEMP/repaired.patch")" -eq 29
          git apply --numstat "$RUNNER_TEMP/repaired.patch" | tee "$RUNNER_TEMP/repaired.numstat"
          sha256sum "$RUNNER_TEMP/repaired.patch.gz" "$RUNNER_TEMP/repaired.patch" | tee "$RUNNER_TEMP/repaired.sha256"
          gzip --test "$RUNNER_TEMP/repaired.patch.gz"
          git status --short | tee "$RUNNER_TEMP/status-after.txt"
          test ! -s "$RUNNER_TEMP/status-after.txt"

      - name: Upload exact repair receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kmod-fallback-single-bit-repair-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/repaired.patch.gz
            ${{ runner.temp }}/repaired.patch
            ${{ runner.temp }}/repaired.numstat
            ${{ runner.temp }}/repaired.sha256
            ${{ runner.temp }}/status-after.txt
          if-no-files-found: warn
          retention-days: 30
