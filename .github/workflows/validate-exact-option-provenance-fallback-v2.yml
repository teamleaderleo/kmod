name: Validate exact option provenance fallback v2

on:
  push:
    branches:
      - experiment/modprobe-exact-option-provenance-fallback
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exact-option-provenance-fallback-v2-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  diagnose-carrier:
    name: fallback Base64 repair search
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact experiment branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: experiment/modprobe-exact-option-provenance-fallback
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source and search Base64 substitutions
        shell: bash
        run: |
          set -euo pipefail
          base=5086df53090b2fe9fa1c31351c05a78a12a4ba71
          test "$(git merge-base HEAD "$base")" = "$base"
          test "$(git rev-parse "$base:tools/modprobe.c")" = \
            413960cae0f39945a3f2d6509dc4a8c262ae2609
          git diff --quiet "$base" -- . ':(exclude).github'
          carrier=.github/modprobe-exact-option-provenance-fallback.patch.gz.b64
          echo 'c11bc8225e9e16f29638bbc9c5cf53ccd3c0a21d5be6ae31df2f392e86b59599  '"$carrier" | sha256sum --check

          CARRIER="$carrier" OUT_GZIP="$RUNNER_TEMP/repaired.patch.gz" OUT_PATCH="$RUNNER_TEMP/repaired.patch" python3 - <<'PY'
          import base64
          import binascii
          import hashlib
          import os
          import pathlib
          import struct
          import zlib

          alphabet = b"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/"
          raw = pathlib.Path(os.environ["CARRIER"]).read_bytes()
          compact = bytearray(b"".join(raw.split()))
          damaged_gz = base64.b64decode(compact, validate=True)
          expected_crc, expected_size = struct.unpack("<II", damaged_gz[-8:])
          print(f"base64_chars={len(compact)} gzip_bytes={len(damaged_gz)} expected_crc={expected_crc:08x} expected_size={expected_size}")

          mapped_gzip_offset = 5354
          mapped_b64 = (mapped_gzip_offset // 3) * 4
          print(f"mapped_base64_index={mapped_b64}")

          def search(indices, label):
              found = []
              attempts = 0
              for idx in indices:
                  original = compact[idx]
                  if original == ord('='):
                      continue
                  for value in alphabet:
                      if value == original:
                          continue
                      attempts += 1
                      compact[idx] = value
                      try:
                          gz = base64.b64decode(compact, validate=True)
                          out = zlib.decompress(gz, wbits=31)
                      except (binascii.Error, zlib.error):
                          continue
                      if len(out) != expected_size:
                          continue
                      if (binascii.crc32(out) & 0xffffffff) != expected_crc:
                          continue
                      found.append((idx, original, value, gz, out))
                  compact[idx] = original
              print(f"{label}.attempts={attempts} matches={len(found)}")
              return found

          lo = max(0, mapped_b64 - 256)
          hi = min(len(compact), mapped_b64 + 257)
          found = search(range(lo, hi), "near")
          if not found:
              found = search(range(len(compact)), "full")

          unique = {}
          for item in found:
              unique[item[3]] = item
          found = list(unique.values())
          print(f"unique_matching_base64_repairs={len(found)}")
          for idx, original, value, gz, out in found:
              print(f"repair base64_index={idx} old={chr(original)!r} new={chr(value)!r}")
              print(f"repaired_gzip_sha256={hashlib.sha256(gz).hexdigest()}")
              print(f"repaired_patch_sha256={hashlib.sha256(out).hexdigest()}")
          if len(found) != 1:
              raise SystemExit(2)

          _, _, _, gz, out = found[0]
          pathlib.Path(os.environ["OUT_GZIP"]).write_bytes(gz)
          pathlib.Path(os.environ["OUT_PATCH"]).write_bytes(out)
          PY

          gzip --test "$RUNNER_TEMP/repaired.patch.gz"
          git apply --check "$RUNNER_TEMP/repaired.patch"
          test "$(grep -c '^diff --git ' "$RUNNER_TEMP/repaired.patch")" -eq 29
          git apply --numstat "$RUNNER_TEMP/repaired.patch" | tee "$RUNNER_TEMP/repaired.numstat"
          cut -f3- "$RUNNER_TEMP/repaired.numstat" | LC_ALL=C sort > "$RUNNER_TEMP/repaired-files.txt"
          test "$(wc -l < "$RUNNER_TEMP/repaired-files.txt")" -eq 29
          echo '1439259c98f50a66778b71c6f7cc5ce442edbf484ad735316a49401ec747e435  '"$RUNNER_TEMP/repaired-files.txt" | sha256sum --check
          sha256sum "$RUNNER_TEMP/repaired.patch.gz" "$RUNNER_TEMP/repaired.patch" | tee "$RUNNER_TEMP/repaired.sha256"
          git status --short | tee "$RUNNER_TEMP/status-after.txt"
          test ! -s "$RUNNER_TEMP/status-after.txt"

      - name: Upload exact repair receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kmod-fallback-base64-repair-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/repaired.patch.gz
            ${{ runner.temp }}/repaired.patch
            ${{ runner.temp }}/repaired.numstat
            ${{ runner.temp }}/repaired-files.txt
            ${{ runner.temp }}/repaired.sha256
            ${{ runner.temp }}/status-after.txt
          if-no-files-found: warn
          retention-days: 30
