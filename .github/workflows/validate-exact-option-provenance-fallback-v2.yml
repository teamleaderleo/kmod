name: Validate exact option provenance fallback v2

on:
  push:
    branches:
      - experiment/modprobe-exact-option-provenance-fallback
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exact-option-provenance-fallback-v2-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  diagnose-carrier:
    name: fallback two-bit repair search
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact experiment branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: experiment/modprobe-exact-option-provenance-fallback
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source and search nearby two-bit flips
        shell: bash
        run: |
          set -euo pipefail
          base=5086df53090b2fe9fa1c31351c05a78a12a4ba71
          test "$(git merge-base HEAD "$base")" = "$base"
          test "$(git rev-parse "$base:tools/modprobe.c")" = \
            413960cae0f39945a3f2d6509dc4a8c262ae2609
          git diff --quiet "$base" -- . ':(exclude).github'
          carrier=.github/modprobe-exact-option-provenance-fallback.patch.gz.b64
          echo 'c11bc8225e9e16f29638bbc9c5cf53ccd3c0a21d5be6ae31df2f392e86b59599  '"$carrier" | sha256sum --check
          base64 --decode "$carrier" > "$RUNNER_TEMP/damaged.patch.gz"

          set +e
          GZIP="$RUNNER_TEMP/damaged.patch.gz" \
          OUT_GZIP="$RUNNER_TEMP/repaired.patch.gz" \
          OUT_PATCH="$RUNNER_TEMP/repaired.patch" \
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/two-bit-search.log"
          import binascii
          import hashlib
          import os
          import pathlib
          import struct
          import zlib

          gz = bytearray(pathlib.Path(os.environ["GZIP"]).read_bytes())
          expected_crc, expected_size = struct.unpack("<II", gz[-8:])
          mapped = 5354
          payload_lo = 10
          payload_hi = len(gz) - 8
          byte_lo = max(payload_lo, mapped - 64)
          byte_hi = min(payload_hi, mapped + 65)
          positions = [(offset, bit) for offset in range(byte_lo, byte_hi) for bit in range(8)]
          print(f"gzip_bytes={len(gz)} expected_crc={expected_crc:08x} expected_size={expected_size}")
          print(f"byte_window={byte_lo}:{byte_hi} bytes={byte_hi - byte_lo} bit_positions={len(positions)}")

          found = []
          attempts = 0
          for first in range(len(positions)):
              off1, bit1 = positions[first]
              mask1 = 1 << bit1
              gz[off1] ^= mask1
              for second in range(first + 1, len(positions)):
                  off2, bit2 = positions[second]
                  if off2 == off1:
                      continue
                  attempts += 1
                  mask2 = 1 << bit2
                  gz[off2] ^= mask2
                  try:
                      out = zlib.decompress(bytes(gz), wbits=31)
                  except zlib.error:
                      out = None
                  if out is not None and len(out) == expected_size and \
                     (binascii.crc32(out) & 0xffffffff) == expected_crc:
                      found.append((off1, bit1, off2, bit2, bytes(gz), out))
                  gz[off2] ^= mask2
              gz[off1] ^= mask1

          print(f"attempts={attempts} matches={len(found)}")
          unique = {}
          for item in found:
              unique[item[4]] = item
          found = list(unique.values())
          print(f"unique_matching_two_bit_repairs={len(found)}")
          for off1, bit1, off2, bit2, repaired, out in found:
              print(f"repair byte1={off1} bit1={bit1} byte2={off2} bit2={bit2}")
              print(f"repaired_gzip_sha256={hashlib.sha256(repaired).hexdigest()}")
              print(f"repaired_patch_sha256={hashlib.sha256(out).hexdigest()}")
          if len(found) != 1:
              raise SystemExit(2)

          _, _, _, _, repaired, out = found[0]
          pathlib.Path(os.environ["OUT_GZIP"]).write_bytes(repaired)
          pathlib.Path(os.environ["OUT_PATCH"]).write_bytes(out)
          PY
          search_status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$search_status" > "$RUNNER_TEMP/two-bit-search.status"
          test "$search_status" -eq 0

          gzip --test "$RUNNER_TEMP/repaired.patch.gz"
          git apply --check "$RUNNER_TEMP/repaired.patch"
          test "$(grep -c '^diff --git ' "$RUNNER_TEMP/repaired.patch")" -eq 29
          git apply --numstat "$RUNNER_TEMP/repaired.patch" | tee "$RUNNER_TEMP/repaired.numstat"
          cut -f3- "$RUNNER_TEMP/repaired.numstat" | LC_ALL=C sort > "$RUNNER_TEMP/repaired-files.txt"
          test "$(wc -l < "$RUNNER_TEMP/repaired-files.txt")" -eq 29
          echo '1439259c98f50a66778b71c6f7cc5ce442edbf484ad735316a49401ec747e435  '"$RUNNER_TEMP/repaired-files.txt" | sha256sum --check
          sha256sum "$RUNNER_TEMP/repaired.patch.gz" "$RUNNER_TEMP/repaired.patch" | tee "$RUNNER_TEMP/repaired.sha256"

      - name: Verify cleanup state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git status --short | tee "$RUNNER_TEMP/status-after.txt"
          test ! -s "$RUNNER_TEMP/status-after.txt"

      - name: Upload exact repair receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kmod-fallback-two-bit-repair-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/two-bit-search.log
            ${{ runner.temp }}/two-bit-search.status
            ${{ runner.temp }}/repaired.patch.gz
            ${{ runner.temp }}/repaired.patch
            ${{ runner.temp }}/repaired.numstat
            ${{ runner.temp }}/repaired-files.txt
            ${{ runner.temp }}/repaired.sha256
            ${{ runner.temp }}/status-after.txt
          if-no-files-found: warn
          retention-days: 30
