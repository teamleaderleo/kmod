name: Diagnose inherited modprobe root

on:
  push:
    branches: [experiment/modprobe-exact-option-provenance-fallback-reconstructed]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inherited-root:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      KDIR: any
      ASAN_OPTIONS: abort_on_error=1:detect_leaks=1:strict_string_checks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: experiment/modprobe-exact-option-provenance-fallback-reconstructed
          fetch-depth: 0
          persist-credentials: false

      - name: Recover attributable inputs
        shell: bash
        run: |
          set -euo pipefail
          base=5086df53090b2fe9fa1c31351c05a78a12a4ba71
          test "$(git merge-base HEAD "$base")" = "$base"
          git diff --quiet "$base" -- . ':(exclude).github'

          git show origin/experiment/modprobe-exact-option-provenance:.github/modprobe-exact-option-provenance.patch.gz.b64 | base64 -d > "$RUNNER_TEMP/strict.gz"
          echo 'ae01646901a5bc8305a4869446344022e21be420414ab6074fa1e2a7a5be75bd  '"$RUNNER_TEMP/strict.gz" | sha256sum -c
          gzip -dc "$RUNNER_TEMP/strict.gz" > "$RUNNER_TEMP/strict.patch"
          echo 'caed53a3a7f5dc57f2d4114da21a623dfd9ea1343881bdced3617adf30ecee32  '"$RUNNER_TEMP/strict.patch" | sha256sum -c

          git show origin/experiment/modprobe-exact-option-provenance-fallback:.github/modprobe-exact-option-provenance-fallback.patch.gz.b64 | base64 -d > "$RUNNER_TEMP/fallback.gz"
          set +e
          gzip -dc "$RUNNER_TEMP/fallback.gz" > "$RUNNER_TEMP/fallback.damaged.patch" 2> "$RUNNER_TEMP/fallback-gzip.err"
          damaged=$?
          set -e
          test "$damaged" -ne 0

          PATCH="$RUNNER_TEMP/fallback.damaged.patch" STRICT="$RUNNER_TEMP/strict.patch" FIXTURES="$RUNNER_TEMP/fixtures.patch" TOOLS="$RUNNER_TEMP/strict-tools.patch" python3 - <<'PY'
          import os
          from pathlib import Path

          def sections(text):
              lines = text.splitlines(keepends=True)
              starts = [i for i, line in enumerate(lines) if line.startswith('diff --git ')]
              starts.append(len(lines))
              return [''.join(lines[starts[i]:starts[i + 1]]) for i in range(len(starts) - 1)]

          fallback = sections(Path(os.environ['PATCH']).read_text(errors='surrogateescape'))
          strict = sections(Path(os.environ['STRICT']).read_text(errors='surrogateescape'))
          assert len(fallback) == 29
          Path(os.environ['FIXTURES']).write_text(''.join(fallback[:28]), errors='surrogateescape')
          tools = next(s for s in strict if s.startswith('diff --git a/tools/modprobe.c b/tools/modprobe.c'))
          Path(os.environ['TOOLS']).write_text(tools, errors='surrogateescape')
          PY

          git apply --check "$RUNNER_TEMP/fixtures.patch"
          git apply "$RUNNER_TEMP/fixtures.patch"

      - name: Set up build dependencies
        shell: bash
        run: sudo -E ./.github/actions/setup-os/setup-ubuntu.sh

      - name: Run exact baseline control
        shell: bash
        run: |
          set -euo pipefail
          meson setup --native-file build-dev.ini -Dmbedtls=disabled build-baseline
          meson compile -C build-baseline
          meson compile -C build-baseline testsuite/create-rootfs

          root=build-baseline/testsuite/rootfs/test-modprobe/exact-options-provenance/custom-root/lib/modules/4.4.4
          echo '--- baseline custom-root inventory ---'
          find "$root" -maxdepth 3 -type f -printf '%P %s bytes\n' | LC_ALL=C sort
          echo '--- baseline modules.dep ---'
          cat "$root/modules.dep"

          set +e
          ( source scripts/sanitizer-env.sh; build-baseline/testsuite/test-modprobe modprobe_exact_options_inherited_root ) 2>&1 | tee "$RUNNER_TEMP/baseline.log"
          status=${PIPESTATUS[0]}
          set -e
          printf 'baseline_status=%s\n' "$status"

      - name: Run strict predecessor control
        shell: bash
        run: |
          set -euo pipefail
          git apply --check "$RUNNER_TEMP/strict-tools.patch"
          git apply "$RUNNER_TEMP/strict-tools.patch"
          clang-format -i tools/modprobe.c
          meson setup --native-file build-dev.ini -Dmbedtls=disabled build-candidate
          meson compile -C build-candidate
          meson compile -C build-candidate testsuite/create-rootfs

          set +e
          ( source scripts/sanitizer-env.sh; build-candidate/testsuite/test-modprobe modprobe_exact_options_inherited_root ) 2>&1 | tee "$RUNNER_TEMP/strict.log"
          status=${PIPESTATUS[0]}
          set -e
          printf 'strict_status=%s\n' "$status"

      - name: Run fallback successor control
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/modprobe.c')
          text = p.read_text()
          old = '''\t\terr = option_transport_render_legacy(base, generated, &expected);\n\t\tif (err < 0 || !streq(expected, legacy)) {\n\t\t\tif (err >= 0)\n\t\t\t\terr = -EINVAL;\n\t\t\tgoto error;\n\t\t}\n'''
          new = '''\t\terr = option_transport_render_legacy(base, generated, &expected);\n\t\tif (err < 0)\n\t\t\tgoto error;\n\t\tif (!streq(expected, legacy)) {\n\t\t\tchar *rebased = strdup(legacy);\n\n\t\t\tif (rebased == NULL) {\n\t\t\t\terr = -ENOMEM;\n\t\t\t\tgoto error;\n\t\t\t}\n\t\t\tfree(base);\n\t\t\tbase = rebased;\n\t\t\toption_transport_clear(generated);\n\t\t}\n'''
          assert text.count(old) == 1
          p.write_text(text.replace(old, new))
          PY
          clang-format -i tools/modprobe.c
          meson compile -C build-candidate

          set +e
          ( source scripts/sanitizer-env.sh; build-candidate/testsuite/test-modprobe modprobe_exact_options_inherited_root ) 2>&1 | tee "$RUNNER_TEMP/fallback.log"
          status=${PIPESTATUS[0]}
          set -e
          printf 'fallback_status=%s\n' "$status"

      - name: Restore carrier tree
        if: always()
        shell: bash
        run: |
          git reset --hard HEAD
          git clean -fdx
          test -z "$(git status --short)"
