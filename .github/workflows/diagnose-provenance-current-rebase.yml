name: Diagnose provenance fallback current rebase

on:
  push:
    branches: [experiment/modprobe-provenance-fallback-current-master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebase:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: experiment/modprobe-provenance-fallback-current-master
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact current base
        shell: bash
        run: |
          set -euo pipefail
          base=dae6c02ffed2e8d16da8dba16d974fc955eebb1f
          test "$(git rev-parse HEAD^)" = "$base"
          test "$(git rev-parse "$base:tools/modprobe.c")" = c4b5021137a01529d75d9979e262308ce371bbae
          git diff --quiet "$base" -- . ':(exclude).github'

      - name: Recover clean strict source and intact fallback fixtures
        shell: bash
        run: |
          set -euo pipefail
          git show origin/experiment/modprobe-exact-option-provenance:.github/modprobe-exact-option-provenance.patch.gz.b64 | base64 -d > "$RUNNER_TEMP/strict.gz"
          echo 'ae01646901a5bc8305a4869446344022e21be420414ab6074fa1e2a7a5be75bd  '"$RUNNER_TEMP/strict.gz" | sha256sum -c
          gzip -dc "$RUNNER_TEMP/strict.gz" > "$RUNNER_TEMP/strict.patch"
          echo 'caed53a3a7f5dc57f2d4114da21a623dfd9ea1343881bdced3617adf30ecee32  '"$RUNNER_TEMP/strict.patch" | sha256sum -c

          git show origin/experiment/modprobe-exact-option-provenance-fallback:.github/modprobe-exact-option-provenance-fallback.patch.gz.b64 | base64 -d > "$RUNNER_TEMP/fallback.gz"
          set +e
          gzip -dc "$RUNNER_TEMP/fallback.gz" > "$RUNNER_TEMP/fallback.damaged.patch" 2> "$RUNNER_TEMP/fallback-gzip.err"
          status=$?
          set -e
          test "$status" -ne 0

          PATCH="$RUNNER_TEMP/fallback.damaged.patch" STRICT="$RUNNER_TEMP/strict.patch" FIXTURES="$RUNNER_TEMP/fixtures.patch" TOOLS="$RUNNER_TEMP/strict-tools.patch" python3 - <<'PY'
          import os
          from pathlib import Path

          def sections(text):
              lines = text.splitlines(keepends=True)
              starts = [i for i, line in enumerate(lines) if line.startswith('diff --git ')]
              starts.append(len(lines))
              return [''.join(lines[starts[i]:starts[i + 1]]) for i in range(len(starts) - 1)]

          fallback = sections(Path(os.environ['PATCH']).read_text(errors='surrogateescape'))
          strict = sections(Path(os.environ['STRICT']).read_text(errors='surrogateescape'))
          assert len(fallback) == 29
          Path(os.environ['FIXTURES']).write_text(''.join(fallback[:28]), errors='surrogateescape')
          tools = next(s for s in strict if s.startswith('diff --git a/tools/modprobe.c b/tools/modprobe.c'))
          Path(os.environ['TOOLS']).write_text(tools, errors='surrogateescape')
          PY

      - name: Three-way apply current rebase
        shell: bash
        run: |
          set -uo pipefail
          fixture_status=0
          tools_status=0
          git apply --3way --index "$RUNNER_TEMP/fixtures.patch" || fixture_status=$?
          if [[ "$fixture_status" -eq 0 ]]; then
            git apply --3way --index "$RUNNER_TEMP/strict-tools.patch" || tools_status=$?
          fi
          printf 'fixture_status=%s\ntools_status=%s\n' "$fixture_status" "$tools_status" | tee "$RUNNER_TEMP/rebase-status.txt"
          git status --short | tee "$RUNNER_TEMP/status.txt"
          git diff --cached --stat | tee "$RUNNER_TEMP/cached-stat.txt"
          git diff --cc -- tools/modprobe.c | tee "$RUNNER_TEMP/modprobe-conflict.diff" || true
          git diff --cached -- tools/modprobe.c | tee "$RUNNER_TEMP/modprobe-staged.diff" || true
          test "$fixture_status" -eq 0
          test "$tools_status" -eq 0
          git diff --cached --check
          git diff --cached --name-only | LC_ALL=C sort | tee "$RUNNER_TEMP/files.txt"

      - name: Upload rebase receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provenance-current-rebase-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/fallback-gzip.err
            ${{ runner.temp }}/rebase-status.txt
            ${{ runner.temp }}/status.txt
            ${{ runner.temp }}/cached-stat.txt
            ${{ runner.temp }}/modprobe-conflict.diff
            ${{ runner.temp }}/modprobe-staged.diff
            ${{ runner.temp }}/files.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Restore carrier tree
        if: always()
        shell: bash
        run: |
          git reset --hard HEAD
          git clean -fdx
          test -z "$(git status --short)"
