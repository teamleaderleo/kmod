name: Validate exact option provenance fallback

on:
  push:
    branches:
      - experiment/modprobe-exact-option-provenance-fallback
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exact-option-provenance-fallback-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  apply-build-test:
    name: fallback experiment (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    env:
      KDIR: any

    steps:
      - name: Check out exact experiment carrier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact source base
        shell: bash
        run: |
          set -euo pipefail
          base=5086df53090b2fe9fa1c31351c05a78a12a4ba71
          test "$(git merge-base HEAD "$base")" = "$base"
          test "$(git rev-parse "$base:tools/modprobe.c")" = \
            413960cae0f39945a3f2d6509dc4a8c262ae2609
          git diff --quiet "$base" -- . ':(exclude).github'
          git rev-parse HEAD > "$RUNNER_TEMP/carrier-head.txt"
          git rev-parse "$base" > "$RUNNER_TEMP/source-base.txt"
          git status --short > "$RUNNER_TEMP/carrier-status-before.txt"
          test ! -s "$RUNNER_TEMP/carrier-status-before.txt"

      - name: Reconstruct and apply exact fallback patch
        shell: bash
        run: |
          set -euo pipefail
          gzip_file="$RUNNER_TEMP/modprobe-exact-option-provenance-fallback.patch.gz"
          patch="$RUNNER_TEMP/modprobe-exact-option-provenance-fallback.patch"
          base64 --decode .github/modprobe-exact-option-provenance-fallback.patch.gz.b64 > "$gzip_file"
          echo '00fba109da5b83ba99e6566f79dad8020c43f1551dd48834aaab107feef04fde  '"$gzip_file" | sha256sum --check
          gzip --decompress --stdout "$gzip_file" > "$patch"
          echo '4a2949348b5417b6a47f9578df4f50fb5ed8742bec173e09324560b14292cd66  '"$patch" | sha256sum --check
          git apply --check --index "$patch"
          git apply --index "$patch"
          git diff --cached --check
          git diff --cached --binary > "$RUNNER_TEMP/materialized-fallback.patch"
          sha256sum "$RUNNER_TEMP/materialized-fallback.patch" > "$RUNNER_TEMP/materialized-fallback.sha256"

          python3 - <<'PY'
          import subprocess

          expected = {
              "scripts/setup-rootfs.sh",
              "testsuite/rootfs-pristine/test-modprobe/exact-options-policy/correct-exact.txt",
              "testsuite/rootfs-pristine/test-modprobe/exact-options-policy/correct-legacy.txt",
              "testsuite/rootfs-pristine/test-modprobe/exact-options-policy/exact config/exact.conf",
              "testsuite/rootfs-pristine/test-modprobe/exact-options-policy/legacy config/legacy.conf",
              "testsuite/rootfs-pristine/test-modprobe/exact-options-policy/lib/modules/4.4.4/modules.alias",
              "testsuite/rootfs-pristine/test-modprobe/exact-options-policy/lib/modules/4.4.4/modules.dep",
              "testsuite/rootfs-pristine/test-modprobe/exact-options-policy/lib/modules/4.4.4/modules.devname",
              "testsuite/rootfs-pristine/test-modprobe/exact-options-policy/lib/modules/4.4.4/modules.softdep",
              "testsuite/rootfs-pristine/test-modprobe/exact-options-policy/lib/modules/4.4.4/modules.symbols",
              "testsuite/rootfs-pristine/test-modprobe/exact-options-policy/mutation-config/mutation.conf",
              "testsuite/rootfs-pristine/test-modprobe/exact-options-policy/raw\\config/modprobe.conf",
              "testsuite/rootfs-pristine/test-modprobe/exact-options-provenance/config dir/provenance.conf",
              "testsuite/rootfs-pristine/test-modprobe/exact-options-provenance/correct.txt",
              "testsuite/rootfs-pristine/test-modprobe/exact-options-provenance/custom-root/lib/modules/4.4.4/modules.alias",
              "testsuite/rootfs-pristine/test-modprobe/exact-options-provenance/custom-root/lib/modules/4.4.4/modules.dep",
              "testsuite/rootfs-pristine/test-modprobe/exact-options-provenance/custom-root/lib/modules/4.4.4/modules.devname",
              "testsuite/rootfs-pristine/test-modprobe/exact-options-provenance/custom-root/lib/modules/4.4.4/modules.softdep",
              "testsuite/rootfs-pristine/test-modprobe/exact-options-provenance/custom-root/lib/modules/4.4.4/modules.symbols",
              "testsuite/rootfs-pristine/test-modprobe/exact-options-recursive/config dir/modprobe.conf",
              "testsuite/rootfs-pristine/test-modprobe/exact-options-recursive/correct-lengths.txt",
              "testsuite/rootfs-pristine/test-modprobe/exact-options-recursive/correct.txt",
              "testsuite/rootfs-pristine/test-modprobe/exact-options-recursive/lib/modules/4.4.4/modules.alias",
              "testsuite/rootfs-pristine/test-modprobe/exact-options-recursive/lib/modules/4.4.4/modules.dep",
              "testsuite/rootfs-pristine/test-modprobe/exact-options-recursive/lib/modules/4.4.4/modules.devname",
              "testsuite/rootfs-pristine/test-modprobe/exact-options-recursive/lib/modules/4.4.4/modules.softdep",
              "testsuite/rootfs-pristine/test-modprobe/exact-options-recursive/lib/modules/4.4.4/modules.symbols",
              "testsuite/test-modprobe.c",
              "tools/modprobe.c",
          }
          raw = subprocess.check_output(
              ["git", "diff", "--cached", "--name-only", "-z"]
          ).decode("utf-8")
          observed = {item for item in raw.split("\0") if item}
          if observed != expected:
              raise SystemExit(
                  f"materialized file fence mismatch\nmissing={sorted(expected-observed)}\n"
                  f"extra={sorted(observed-expected)}"
              )
          PY

      - name: Set up build dependencies
        shell: bash
        run: sudo -E ./.github/actions/setup-os/setup-ubuntu.sh

      - name: Check materialized source formatting
        shell: bash
        run: clang-format --dry-run --Werror tools/modprobe.c testsuite/test-modprobe.c

      - name: Configure and build with sanitizers
        shell: bash
        env:
          CC: ${{ matrix.compiler }}
        run: |
          set -euo pipefail
          extra=()
          if [[ "${{ matrix.compiler }}" == clang ]]; then
            extra+=("-Db_lundef=false")
          fi
          meson setup --native-file build-dev.ini \
            -Dmbedtls=disabled \
            "${extra[@]}" \
            build-${{ matrix.compiler }}
          meson compile -C build-${{ matrix.compiler }}
          if [[ "${{ matrix.compiler }}" == clang ]]; then
            export LD_LIBRARY_PATH="$(clang -print-resource-dir)/lib/linux${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          fi
          "build-${{ matrix.compiler }}/modprobe" --version | \
            tee "$RUNNER_TEMP/modprobe-version-${{ matrix.compiler }}.txt"

      - name: Run focused native suite twice
        shell: bash
        env:
          CC: ${{ matrix.compiler }}
        run: |
          set -euo pipefail
          build=build-${{ matrix.compiler }}
          for pass in first rerun; do
            meson compile -C "$build" testsuite/create-rootfs
            meson test -C "$build" test-modprobe --verbose \
              2>&1 | tee "$RUNNER_TEMP/focused-${{ matrix.compiler }}-$pass.log"
          done

      - name: Run complete native suite
        shell: bash
        env:
          CC: ${{ matrix.compiler }}
        run: |
          set -euo pipefail
          build=build-${{ matrix.compiler }}
          meson compile -C "$build" testsuite/create-rootfs
          meson test -C "$build" --print-errorlogs \
            2>&1 | tee "$RUNNER_TEMP/full-${{ matrix.compiler }}.log"

      - name: Run safe fallback discriminator
        shell: bash
        env:
          CC: ${{ matrix.compiler }}
          ASAN_OPTIONS: abort_on_error=1:detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          if [[ "${{ matrix.compiler }}" == clang ]]; then
            export LD_LIBRARY_PATH="$(clang -print-resource-dir)/lib/linux${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          fi
          python3 .github/test-modprobe-option-provenance-fallback.py \
            "$PWD/build-${{ matrix.compiler }}/modprobe" \
            > "$RUNNER_TEMP/fallback-${{ matrix.compiler }}.json"

      - name: Retain exact receipts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/fallback-receipt-${{ matrix.compiler }}"
          mkdir -p "$out"
          cp "$RUNNER_TEMP"/carrier-head.txt \
             "$RUNNER_TEMP"/source-base.txt \
             "$RUNNER_TEMP"/carrier-status-before.txt \
             "$RUNNER_TEMP"/materialized-fallback.patch \
             "$RUNNER_TEMP"/materialized-fallback.sha256 \
             "$RUNNER_TEMP"/modprobe-version-${{ matrix.compiler }}.txt \
             "$RUNNER_TEMP"/focused-${{ matrix.compiler }}-first.log \
             "$RUNNER_TEMP"/focused-${{ matrix.compiler }}-rerun.log \
             "$RUNNER_TEMP"/full-${{ matrix.compiler }}.log \
             "$RUNNER_TEMP"/fallback-${{ matrix.compiler }}.json \
             "$out/" 2>/dev/null || true
          if [[ -x build-${{ matrix.compiler }}/modprobe ]]; then
            sha256sum build-${{ matrix.compiler }}/modprobe > "$out/modprobe.sha256"
          fi
          sha256sum .github/modprobe-exact-option-provenance-fallback.patch.gz.b64 \
            .github/test-modprobe-option-provenance-fallback.py > "$out/carriers.sha256"
          git diff --cached --name-status > "$out/materialized-files.txt"

      - name: Restore carrier state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -fdx
          git status --short | tee "$RUNNER_TEMP/carrier-status-after.txt"
          test ! -s "$RUNNER_TEMP/carrier-status-after.txt"

      - name: Upload fallback receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kmod-exact-option-provenance-fallback-${{ matrix.compiler }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/fallback-receipt-${{ matrix.compiler }}/
            ${{ runner.temp }}/carrier-status-after.txt
          if-no-files-found: error
          retention-days: 30
