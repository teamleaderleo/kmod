# Internal owned-fork source-materialization gate.
name: Materialize empty MODPROBE_OPTIONS fix

on:
  push:
    branches:
      - fix/modprobe-empty-options-current
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-empty-options-current
  cancel-in-progress: true

jobs:
  validate-and-materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      KDIR: any
      BASE: dae6c02ffed2e8d16da8dba16d974fc955eebb1f
      ASAN_OPTIONS: abort_on_error=1:detect_leaks=1:strict_string_checks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: fix/modprobe-empty-options-current

      - name: Verify exact current base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          test "$(git rev-parse "$BASE:tools/modprobe.c")" = c4b5021137a01529d75d9979e262308ce371bbae
          test "$(git rev-parse "$BASE:testsuite/test-modprobe.c")" = 6b62644ae56ad76e031e70dfa8fa697110b64e82

      - name: Setup OS
        shell: bash
        run: sudo -E ./.github/actions/setup-os/setup-ubuntu.sh

      - name: Apply exact two-file fix
        shell: bash
        run: |
          set -euo pipefail
          sha256sum .github/modprobe-empty-options-current.patch
          git apply --check .github/modprobe-empty-options-current.patch
          git apply .github/modprobe-empty-options-current.patch
          rm .github/modprobe-empty-options-current.patch
          rm .github/workflows/materialize-empty-options-current.yml
          git diff --check "$BASE"
          test "$(git diff --name-only "$BASE" -- testsuite/test-modprobe.c tools/modprobe.c | sort | tr '\n' ' ')" = \
            "testsuite/test-modprobe.c tools/modprobe.c "
          clang-format --dry-run --Werror tools/modprobe.c testsuite/test-modprobe.c

      - name: GCC build and tests
        shell: bash
        env:
          CC: gcc
        run: |
          set -euo pipefail
          meson setup --native-file build-dev.ini -Dmbedtls=disabled build-gcc
          meson compile -C build-gcc
          MODPROBE_OPTIONS='' build-gcc/modprobe --version >gcc-version.out 2>gcc-version.err
          test ! -s gcc-version.err
          meson compile -C build-gcc testsuite/create-rootfs
          meson test -C build-gcc test-modprobe --print-errorlogs
          meson compile -C build-gcc testsuite/create-rootfs
          meson test -C build-gcc --print-errorlogs

      - name: Clang build and tests
        shell: bash
        env:
          CC: clang
        run: |
          set -euo pipefail
          meson setup --native-file build-dev.ini -Dmbedtls=disabled -Db_lundef=false build-clang
          meson compile -C build-clang
          export LD_LIBRARY_PATH="$(clang -print-resource-dir)/lib/linux${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          MODPROBE_OPTIONS='' build-clang/modprobe --version >clang-version.out 2>clang-version.err
          test ! -s clang-version.err
          meson compile -C build-clang testsuite/create-rootfs
          meson test -C build-clang test-modprobe --print-errorlogs
          meson compile -C build-clang testsuite/create-rootfs
          meson test -C build-clang --print-errorlogs

      - name: Commit validated source fix
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-gcc build-clang gcc-version.out gcc-version.err clang-version.out clang-version.err
          git diff --check "$BASE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = \
            "testsuite/test-modprobe.c tools/modprobe.c "
          git commit \
            -m 'modprobe: fix allocation for empty MODPROBE_OPTIONS' \
            -m 'Allocate argv pointer storage and the copied environment string independently so the terminating NUL is always inside the allocation, including for an explicitly empty MODPROBE_OPTIONS value.' \
            -m 'Add a regression exercising an empty private options environment through modprobe --version.'
          git push origin HEAD:fix/modprobe-empty-options-current
