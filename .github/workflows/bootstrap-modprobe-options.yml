# Temporary one-shot branch bootstrap. The workflow removes itself in the
# generated source commit after the patch passes focused build and test gates.
name: Bootstrap modprobe option transport

on:
  push:
    branches:
      - fix/modprobe-options-config-path
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: modprobe-options-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  apply-build-test:
    runs-on: ubuntu-24.04
    env:
      KDIR: any
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: fix/modprobe-options-config-path

      - name: Setup OS
        uses: ./.github/actions/setup-os

      - name: Apply exact patch
        run: |
          sha256sum .github/modprobe-options.patch
          git apply --check .github/modprobe-options.patch
          git apply .github/modprobe-options.patch
          rm .github/modprobe-options.patch
          rm .github/workflows/bootstrap-modprobe-options.yml
          git diff --check

      - name: Format check
        run: clang-format --dry-run --Werror tools/modprobe.c testsuite/test-modprobe.c

      - name: GCC configure and build
        env:
          CC: gcc
        run: |
          meson setup --native-file build-dev.ini build-gcc
          meson compile -C build-gcc

      - name: GCC test
        run: meson test -C build-gcc || meson test -C build-gcc --verbose

      - name: Clang configure and build
        env:
          CC: clang
        run: |
          meson setup --native-file build-dev.ini build-clang
          meson compile -C build-clang

      - name: Clang test
        run: meson test -C build-clang || meson test -C build-clang --verbose

      - name: Commit source change
        if: github.event_name != 'pull_request'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit \
            -m 'modprobe: preserve recursive option arguments' \
            -m 'Escape generated MODPROBE_OPTIONS arguments and parse quoted or backslash-escaped values without changing pathname identity. Reject incomplete quoting instead of silently accepting a truncated argument vector.' \
            -m 'Add native coverage for recursive config paths containing spaces, existing quote forms, backslash escaping, repeated whitespace, and malformed input.'
          git push origin HEAD:fix/modprobe-options-config-path
